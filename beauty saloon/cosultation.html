<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q Beauty Salon - Home Features</title> 
  <script src="https://cdn.tailwindcss.com"></script> 
  <link rel="stylesheet" href="style.css"></link>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <body>
  <!-- ==========================================
       SECTION 1: FREE CONSULTATION HERO BANNER
  =========================================== -->
  <section class="max-w-7xl mx-auto">
    <div class=" bg-purple-100 p-8 md:p-12 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-6">
      
      <div class="space-y-4 max-w-xl lg:p-5">
        <span id="bg-color-nav"class="inline-block px-4 py-1 rounded-full  text-white border border-salon-gold/30 text-sm font-semibold tracking-wide">
          VIP Personalized Care
        </span>
        <h2 id="textc1"  class="text-xl md:text-4xl font-bold text-white leading-tight">
          Looking for the Perfect Solution for</h2> <p class="text-3xl font-semibold ">Your Beauty & Skin?</p>
        </h2>
        <p id="textc1" class="text-sm md:text-base">
          Experience visible results within just 15 days with our
				professional skincare and beauty treatments tailored
				to your unique needs.
        </p>
      </div>

      <div class="mr-20">
        <!-- Consultation Trigger Button -->
        <button id="bg-color-nav" onclick="toggleConsultationModal()" class="flex items-center gap-2  hover:bg-salon-gold text-white transition-all duration-300 font-bold px-8 py-4 rounded-full shadow-lg  hover:-translate-y-1">
          <span class="material-symbols-outlined">calendar_month</span>
          Get a Free Consultation
        </button>
      </div>

    </div>
  </section>
  
  <!-- ==========================================
       MODAL: FREE CONSULTATION POP-UP (JS Controlled)
  =========================================== -->
  <div id="consultationModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4 pt-20">
    <div id="bg-color-nav" class="border-1 border-white border-solid rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      
      <!-- Close Button -->
      <button onclick="toggleConsultationModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
        <span class="material-symbols-outlined">close</span>
      </button>

      <h3 class="text-2xl font-bold text-white mb-2">Free Consultation</h3>
      <p class="text-gray-300 text-sm mb-6">Enter Your details</p>

      <form class="space-y-4" onsubmit="event.preventDefault(); alert('Thank you,We will reach you soon'); toggleConsultationModal();">
        <div>
          <label  class="block text-xs font-semibold text-gray-300 mb-1">Name</label>
          <input type="text" required placeholder="Enter your name" class="w-full bg-[#34113D] border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-salon-gold">
        </div>
        <div>
          <label  class="block text-xs font-semibold text-gray-300 mb-1">Ph.no</label>
          <input type="tel" required placeholder="Enter mobile number" class="w-full bg-[#34113D] border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-salon-gold">
        </div>
        <div>
          <label  class="block text-xs font-semibold text-gray-300 mb-1">service</label>
          <select class="w-full bg-[#34113D] border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-salon-gold">
            <option>Hair Care Consultation</option>
            <option>Skin & Facial Care</option>
            <option>Bridal Makeup Query</option>
			<option>Hand & Feet Consultaion </option>
          </select>
        </div>
        <center><button type="submit" class="w-40  py-1 bg-white  font-bold rounded-2xl  mt-4 ">
          Submit
        </center></button>
      </form>

    </div>
  </div>


  <!-- ==========================================
       JAVASCRIPT FOR MODAL INTERACTION
  =========================================== -->
  <script>
    function toggleConsultationModal() {
      const modal = document.getElementById('consultationModal');
      modal.classList.toggle('hidden');
    }
  </script>
  </body>
  </html>
